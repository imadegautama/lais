name: CI

# Push to main is not a trigger here: Deploy Production already calls this workflow.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.ai/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tes, lint, dan build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, zip, gd, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Lokasi cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi JS
        run: npm ci

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Also generates the Wayfinder files that tsc needs.
      - name: Build aset
        run: npm run build

      # vp check, tsc, Pint, PHPStan, then the whole Pest suite on in-memory SQLite.
      - name: Cek dan tes
        run: composer ci:check
