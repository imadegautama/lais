[program:telegram]
; Long-polls the bot (docs/TELEGRAM.md). Only one poller per token, so run one
; replica. Idle when the bot talks over WhatsApp (BOT_CHANNEL=whatsapp).
command=/bin/sh -c 'if [ "${BOT_CHANNEL:-telegram}" = "telegram" ]; then exec php /var/www/artisan lais:telegram; else exec sleep infinity; fi'
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=40
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
