[program:scheduler]
; Depreciation on the 1st and the evening summary at 21:00 (routes/console.php).
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=60
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
