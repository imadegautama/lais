[program:worker]
; --timeout above the longest job (ProcessWhatsAppMessage, 150 s); DB_QUEUE_RETRY_AFTER must be larger still.
; --tries is left unset so each job keeps its own ($tries = 1 on ProcessWhatsAppMessage).
command=php /var/www/artisan queue:work --sleep=3 --timeout=150 --memory=256 --max-time=3600
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=180
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
