<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    ServerSignature Off

    # Logs go to stdout/stderr so Coolify shows them.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
